name: Feature request
description: Propose a focused improvement to LeslieTavern.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or development problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, user flow, and compatibility expectations.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: impact
    attributes:
      label: Potential impact
      options:
        - label: This may affect chat-core compatibility or SillyTavern data formats.
        - label: This may affect credentials, networking, or private user data.
        - label: This may require a migration or rollback plan.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched the roadmap and existing Issues first.
          required: true
        - label: This request contains no private chat, character, or credential data.
          required: true
