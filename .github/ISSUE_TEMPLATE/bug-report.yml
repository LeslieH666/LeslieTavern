name: Bug report
description: Report a reproducible LeslieTavern problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove chats, character data, API keys, cookies, and personal paths from every attachment.

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Provide the commit hash, tag, or portable-package build date.
      placeholder: e.g. abc1234 or 2026-08-10
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Running mode
      options:
        - Electron development mode
        - Windows local launcher
        - Windows portable package
        - Node.js server
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and browser or Electron version.
      placeholder: Windows 11, Node.js 20.x, Electron 41.x
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a synthetic character or empty profile whenever possible.
      placeholder: |
        1. Start the application using ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Do not attach real JSONL chats, character cards, settings, secrets, or full data directories.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched for an existing Issue describing the same problem.
          required: true
        - label: I removed all private data and credentials from this report.
          required: true
